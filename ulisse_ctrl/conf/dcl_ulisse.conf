
controlLoopRate: 100.0;           # Hz
ctrlMode: 0;                    # 0=ThrusterMapping, 1=classicPidControl, 2=ComputedTorque
enableThrusters: true;
thrusterPercLimit: 100.0;        # percent

# input saturation limits
surgeMin: -5.0;
surgeMax: 5.0;    # Be careful to make the PID Surge saturation smaller than this values !
yawRateMin: -0.5;
yawRateMax: 0.5;  # Be careful to make the PID Heading saturation smaller than this values !

thrusterMapping:
{
    pidSurge:
    {
        kp: 8.0;
        ki: 0.4;
        kd: 0.0;
        kff: 0.6;
        n: 10.0;
        tr: 0.5;
        sat: 2.5;
    };
};

classicPidControl:
{
    pidSurge:
    {
        kp: 0.0
        ki: 0.0;
        kd: 0.0;
        kff: 0.6;
        n: 10.0;
        tr: 0.5;
        sat:400.0;
    };

    pidYawRate:
    {
        kp: 0.0;
        ki: 0.0;
        kd: 0.0;
        kff: 0.0;
        n: 10.0;
        tr: 0.5;
        sat: 560.0;
     };
};

computedTorqueControl:
{
    pidSurge:
    {
        kp: 0.0
        ki: 0.0;
        kd: 0.0;
        kff: 0.0;
        n: 10.0;
        tr: 0.5;
        sat:400.0;
    };

    pidYawRate:
    {
        kp: 0.0;#450.0;
        ki: 0.0;
        kd: 0.0;
        kff: 0.0;
        n: 10.0;
        tr: 0.5;
        sat: 560.0;
    };
};
